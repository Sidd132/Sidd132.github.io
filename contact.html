<form style="max-width: 600px; margin: 60px auto; font-family: Poppins, sans-serif;">
    <div style="margin-bottom: 15px;">
        <label for="name" style="display: block; margin-bottom: 5px;">Name:</label>
        <input type="text" id="name" name="name" required style="width: 200%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
    </div>
    
    <div style="margin-bottom: 15px;">
        <label for="email" style="display: block; margin-bottom: 5px;">Email:</label>

    </div>
    
    <div style="margin-bottom: 15px;">
        <label for="comments" style="display: block; margin-bottom: 5px;">Comments:</label>
        <textarea id="comments" name="comments" rows="5" style="width: 200%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
    </div>
    
    <button type="submit" style="background-color: rgb(0, 41, 3); color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-size: 14px;"><b>Contact</b></button>
